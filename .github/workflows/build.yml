name: Build ZeroTier MSI (Win7/2008R2 x64, Prometheus enabled, robust vcxproj patch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    env:
      CONFIGURATION: Release
      ARCH: x64
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.21.0

      - name: Install vcpkg (bootstrap)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install nlohmann-json:$env:VCPKG_DEFAULT_TRIPLET
          & "$env:VCPKG_ROOT\vcpkg.exe" install prometheus-cpp:$env:VCPKG_DEFAULT_TRIPLET
          $prefix = "C:\vcpkg\installed\x64-windows"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_PREFIX=$prefix"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INCLUDE=$prefix\include"

      - name: Resolve include bases (repo + vcpkg)
        shell: pwsh
        run: |
          $repoBase = "${{ github.workspace }}"
          $promBase = Join-Path $repoBase "ext\prometheus-cpp-lite-1.0\simpleapi\include"
          $vcpkgInc = "C:\vcpkg\installed\x64-windows\include"

          if (!(Test-Path $promBase)) { Write-Warning "Prometheus include base not found: $promBase" }
          if (!(Test-Path (Join-Path $vcpkgInc "nlohmann\json.hpp"))) { Write-Warning "nlohmann/json.hpp not found under $vcpkgInc" }

          Add-Content -Path $env:GITHUB_ENV -Value "PROM_BASE=$promBase"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INCLUDE=$vcpkgInc"

      - name: Locate Visual Studio and DevCmd
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "vswhere did not return installationPath" }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          "VSCMD=$devCmd" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (VS2019 generator, Win7 macros, explicit flags)
        shell: cmd
        run: |
          "%VSCMD%" && ^
          cmake -S . -B build -G "Visual Studio 16 2019" -A %ARCH% -T v142 ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=%VCPKG_DEFAULT_TRIPLET% ^
            -DCMAKE_C_STANDARD=11 -DCMAKE_C_STANDARD_REQUIRED=ON ^
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF ^
            -DCMAKE_C_FLAGS="/EHsc" ^
            -DCMAKE_CXX_FLAGS="/std:c++17 /Zc:__cplusplus /permissive- /EHsc" ^
            -DWINVER=0x0601 -D_WIN32_WINNT=0x0601 -DZT_ENABLE_PROMETHEUS=ON

      - name: Patch vcxproj: AdditionalIncludeDirectories, AdditionalOptions, ExceptionHandling (robust)
        shell: pwsh
        run: |
          $buildDir = "build"
          $vcxFiles = Get-ChildItem -Path $buildDir -Filter *.vcxproj -Recurse -ErrorAction SilentlyContinue
          if (-not $vcxFiles) { throw "No .vcxproj files found under $buildDir" }

          $promBase = $env:PROM_BASE
          $vcpkgInc = $env:VCPKG_INCLUDE

          # Compose include string: put vcpkg include first so prometheus headers from vcpkg resolve benchmark.h
          $incs = @()
          if ($vcpkgInc -and (Test-Path $vcpkgInc)) { $incs += $vcpkgInc }
          if ($promBase -and (Test-Path $promBase)) { $incs += $promBase }
          $newIncStr = ($incs -join ';')

          # AdditionalOptions to force MSVC standard and include paths (cl.exe)
          $addOpts = "/std:c++17"
          foreach ($p in $incs) { $addOpts += " /I`"$p`"" }

          foreach ($f in $vcxFiles) {
            Write-Host "Patching $($f.FullName)"
            [xml]$x = Get-Content $f.FullName

            $ns = $x.Project.NamespaceURI
            $modified = $false

            # Patch ItemDefinitionGroup -> ClCompile
            foreach ($id in $x.Project.ItemDefinitionGroup) {
              if ($id.ClCompile) {
                # AdditionalIncludeDirectories
                $aid = $id.ClCompile.AdditionalIncludeDirectories
                if ($aid -and $aid.InnerText) {
                  # Prepend vcpkg/promBase but keep existing placeholders
                  $aid.InnerText = "$newIncStr;%(AdditionalIncludeDirectories)"
                } else {
                  $n = $x.CreateElement("AdditionalIncludeDirectories", $ns)
                  $n.InnerText = "$newIncStr;%(AdditionalIncludeDirectories)"
                  $id.ClCompile.AppendChild($n) | Out-Null
                }

                # AdditionalOptions (append our forced options)
                $ao = $id.ClCompile.AdditionalOptions
                if ($ao -and $ao.InnerText) {
                  # ensure our options are present (prepend)
                  $ao.InnerText = "$addOpts %(AdditionalOptions)"
                } else {
                  $n2 = $x.CreateElement("AdditionalOptions", $ns)
                  $n2.InnerText = "$addOpts %(AdditionalOptions)"
                  $id.ClCompile.AppendChild($n2) | Out-Null
                }

                # ExceptionHandling -> Sync
                $eh = $id.ClCompile.ExceptionHandling
                if ($eh -and $eh.InnerText) {
                  $eh.InnerText = "Sync"
                } else {
                  $ehNew = $x.CreateElement("ExceptionHandling", $ns)
                  $ehNew.InnerText = "Sync"
                  $id.ClCompile.AppendChild($ehNew) | Out-Null
                }

                $modified = $true
              }
            }

            # Also try to patch PropertyGroup entries that may contain Configuration-specific ClCompile settings
            foreach ($pg in $x.Project.PropertyGroup) {
              # Some projects put AdditionalIncludeDirectories under PropertyGroup/ClCompile
              foreach ($child in $pg.ChildNodes) {
                if ($child.LocalName -eq "ClCompile") {
                  # ensure AdditionalIncludeDirectories exists under this ClCompile
                  $aid = $child.AdditionalIncludeDirectories
                  if ($aid -and $aid.InnerText) {
                    $aid.InnerText = "$newIncStr;%(AdditionalIncludeDirectories)"
                  } else {
                    $n = $x.CreateElement("AdditionalIncludeDirectories", $ns)
                    $n.InnerText = "$newIncStr;%(AdditionalIncludeDirectories)"
                    $child.AppendChild($n) | Out-Null
                  }
                  # AdditionalOptions
                  $ao = $child.AdditionalOptions
                  if ($ao -and $ao.InnerText) {
                    $ao.InnerText = "$addOpts %(AdditionalOptions)"
                  } else {
                    $n2 = $x.CreateElement("AdditionalOptions", $ns)
                    $n2.InnerText = "$addOpts %(AdditionalOptions)"
                    $child.AppendChild($n2) | Out-Null
                  }
                  # ExceptionHandling
                  $eh = $child.ExceptionHandling
                  if ($eh -and $eh.InnerText) {
                    $eh.InnerText = "Sync"
                  } else {
                    $ehNew = $x.CreateElement("ExceptionHandling", $ns)
                    $ehNew.InnerText = "Sync"
                    $child.AppendChild($ehNew) | Out-Null
                  }
                  $modified = $true
                }
              }
            }

            if ($modified) {
              $x.Save($f.FullName)
              Write-Host "Patched $($f.Name): include=$newIncStr, opts=$addOpts"
            } else {
              Write-Warning "No ClCompile/PropertyGroup patch points found in $($f.Name)"
            }
          }

      - name: Build (cmake --build via DevCmd)
        shell: cmd
        run: |
          "%VSCMD%" && cmake --build build --config %CONFIGURATION% --parallel

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wix --version=3.11.2 -y

      - name: Generate installer.wxs
        shell: pwsh
        run: |
          $exePath = "build\Release\zerotier-one.exe"
          if (!(Test-Path $exePath)) { Write-Warning "Executable not found at $exePath" }
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $lines = @(
            '<?xml version="1.0" encoding="UTF-8"?>'
            '<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">'
            '  <Product Id="*" Name="ZeroTierOne" Language="1033" Version="1.0.0.0" Manufacturer="YourOrg" UpgradeCode="11111111-2222-3333-4444-555555555555">'
            '    <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />'
            '    <MediaTemplate />'
            '    <Directory Id="TARGETDIR" Name="SourceDir">'
            '      <Directory Id="ProgramFiles64Folder">'
            '        <Directory Id="INSTALLFOLDER" Name="ZeroTierOne">'
            '          <Component Id="MainExe" Guid="aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee">'
            "            <File Id='ZeroTierExe' Source='$exePath' KeyPath='yes' />"
            '          </Component>'
            '        </Directory>'
            '      </Directory>'
            '    </Directory>'
            '    <Feature Id="ProductFeature" Title="ZeroTierOne" Level="1">'
            '      <ComponentRef Id="MainExe" />'
            '    </Feature>'
            '  </Product>'
            '</Wix>'
          )
          $lines | Set-Content -Path installer\installer.wxs -Encoding UTF8

      - name: Package MSI
        shell: pwsh
        run: |
          candle installer\installer.wxs
          light installer\installer.wixobj -o ZeroTierOne-x64.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTierOne-x64
          path: |
            build/Release/zerotier-one.exe
            ZeroTierOne-x64.msi
