name: Build ZeroTier MSI (Win7/2008R2 x64)

on:
  push:
    branches: [ dev ]   # ZeroTierOne 預設分支是 dev
  pull_request:
    branches: [ dev ]
  workflow_dispatch:     # 支援手動觸發

jobs:
  build:
    runs-on: windows-2019   # 使用 VS2019 (v142 toolset)

    env:
      WINVER: 0x0601
      WIN32_WINNT: 0x0601
      CMAKE_GENERATOR: Visual Studio 16 2019
      MSVC_TOOLSET: v142
      CONFIGURATION: Release
      ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure (CMake → VS2019 solution)
        shell: pwsh
        run: cmake -S . -B build -G "${{ env.CMAKE_GENERATOR }}" -A ${{ env.ARCH }} -T ${{ env.MSVC_TOOLSET }} -DWINVER=${{ env.WINVER }} -D_WIN32_WINNT=${{ env.WIN32_WINNT }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build Solution
        shell: pwsh
        run: msbuild build/ZeroTierOne.sln /p:Configuration=${{ env.CONFIGURATION }} /m

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wix --version=3.11.2 -y

      - name: Generate minimal WiX installer.wxs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          @"
<?xml version='1.0' encoding='UTF-8'?>
<Wix xmlns='http://schemas.microsoft.com/wix/2006/wi'>
  <Product Id='*' Name='ZeroTierOne' Language='1033' Version='1.0.0.0' Manufacturer='YourOrg' UpgradeCode='PUT-GUID-HERE'>
    <Package InstallerVersion='200' Compressed='yes' InstallScope='perMachine' />
    <MediaTemplate />
    <Directory Id='TARGETDIR' Name='SourceDir'>
      <Directory Id='ProgramFilesFolder'>
        <Directory Id='INSTALLFOLDER' Name='ZeroTierOne'>
          <Component Id='MainExe' Guid='PUT-GUID-HERE'>
            <File Id='ZeroTierExe' Source='build\\Release\\zerotier-one.exe' KeyPath='yes' />
          </Component>
        </Directory>
      </Directory>
    </Directory>
    <Feature Id='ProductFeature' Title='ZeroTierOne' Level='1'>
      <ComponentRef Id='MainExe' />
    </Feature>
  </Product>
</Wix>
"@ | Set-Content -Path installer\installer.wxs -Encoding UTF8

      - name: Package MSI
        shell: pwsh
        run: |
          candle installer\installer.wxs
          light installer\installer.wixobj -o ZeroTierOne-x64.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTierOne-x64
          path: |
            build/Release/zerotier-one.exe
            ZeroTierOne-x64.msi
