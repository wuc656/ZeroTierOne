name: Build ZeroTier MSI (Win7/2008R2 x64, Prometheus enabled, vcxproj patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    env:
      CONFIGURATION: Release
      ARCH: x64
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.21.0

      - name: Install vcpkg (bootstrap)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install nlohmann-json:$env:VCPKG_DEFAULT_TRIPLET
          & "$env:VCPKG_ROOT\vcpkg.exe" install prometheus-cpp:$env:VCPKG_DEFAULT_TRIPLET
          $prefix = "C:\vcpkg\installed\x64-windows"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_PREFIX=$prefix"

      - name: Resolve include bases
        shell: pwsh
        run: |
          $repoBase = "${{ github.workspace }}"
          $promBase = Join-Path $repoBase "ext\prometheus-cpp-lite-1.0\simpleapi\include"
          $vcpkgInc = "C:\vcpkg\installed\x64-windows\include"

          if (!(Test-Path $promBase)) {
            Write-Warning "Prometheus simpleapi include base not found: $promBase"
          } elseif (!(Test-Path (Join-Path $promBase "prometheus\simpleapi.h"))) {
            Write-Warning "prometheus/simpleapi.h not found under $promBase"
          }

          if (!(Test-Path (Join-Path $vcpkgInc "nlohmann\json.hpp"))) {
            Write-Warning "nlohmann/json.hpp not found under $vcpkgInc"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "PROM_BASE=$promBase"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INCLUDE=$vcpkgInc"

      - name: Locate Visual Studio and DevCmd
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          "VSCMD=$devCmd" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (VS2019 generator, Win7 macros)
        shell: cmd
        run: |
          "%VSCMD%" && ^
          cmake -S . -B build -G "Visual Studio 16 2019" -A %ARCH% -T v142 ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=%VCPKG_DEFAULT_TRIPLET% ^
            -DCMAKE_C_STANDARD=11 -DCMAKE_C_STANDARD_REQUIRED=ON ^
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF ^
            -DCMAKE_C_FLAGS="/EHsc" ^
            -DCMAKE_CXX_FLAGS="/std:c++17 /Zc:__cplusplus /permissive- /EHsc" ^
            -DWINVER=0x0601 -D_WIN32_WINNT=0x0601 -DZT_ENABLE_PROMETHEUS=ON

      - name: Patch vcxproj AdditionalIncludeDirectories
        shell: pwsh
        run: |
          $vcx = "build\zerotiercore.vcxproj"
          if (!(Test-Path $vcx)) { throw "vcxproj not found: $vcx" }

          [xml]$x = Get-Content $vcx
          $promBase  = $env:PROM_BASE
          $vcpkgInc  = $env:VCPKG_INCLUDE

          $newInc = @()
          if ($promBase) { $newInc += $promBase }
          if ($vcpkgInc) { $newInc += $vcpkgInc }
          $newIncStr = ($newInc -join ';')

          if (-not $newIncStr) {
            Write-Warning "No include bases resolved; skipping vcxproj patch."
          } else {
            $ids = $x.Project.ItemDefinitionGroup
            foreach ($id in $ids) {
              if ($id.ClCompile) {
                $cur = $id.ClCompile.AdditionalIncludeDirectories
                if ($cur) {
                  $cur.InnerText = "$newIncStr;%(AdditionalIncludeDirectories)"
                } else {
                  $n = $x.CreateElement("AdditionalIncludeDirectories", $x.Project.NamespaceURI)
                  $n.InnerText = "$newIncStr;%(AdditionalIncludeDirectories)"
                  $id.ClCompile.AppendChild($n) | Out-Null
                }
                # Also enforce exception handling to silence C4530
                if ($id.ClCompile.ExceptionHandling) {
                  $id.ClCompile.ExceptionHandling.InnerText = "Sync"
                } else {
                  $eh = $x.CreateElement("ExceptionHandling", $x.Project.NamespaceURI)
                  $eh.InnerText = "Sync"
                  $id.ClCompile.AppendChild($eh) | Out-Null
                }
              }
            }
            $x.Save($vcx)
            Write-Host "Patched AdditionalIncludeDirectories with: $newIncStr"
          }

      - name: Build (cmake --build via DevCmd)
        shell: cmd
        run: |
          "%VSCMD%" && cmake --build build --config %CONFIGURATION% --parallel

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wix --version=3.11.2 -y

      - name: Generate installer.wxs
        shell: pwsh
        run: |
          $exePath = "build\Release\zerotier-one.exe"
          if (!(Test-Path $exePath)) { Write-Warning "Executable not found at $exePath" }
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $lines = @(
            '<?xml version="1.0" encoding="UTF-8"?>'
            '<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">'
            '  <Product Id="*" Name="ZeroTierOne" Language="1033" Version="1.0.0.0" Manufacturer="YourOrg" UpgradeCode="11111111-2222-3333-4444-555555555555">'
            '    <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />'
            '    <MediaTemplate />'
            '    <Directory Id="TARGETDIR" Name="SourceDir">'
            '      <Directory Id="ProgramFiles64Folder">'
            '        <Directory Id="INSTALLFOLDER" Name="ZeroTierOne">'
            '          <Component Id="MainExe" Guid="aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee">'
            "            <File Id='ZeroTierExe' Source='$exePath' KeyPath='yes' />"
            '          </Component>'
            '        </Directory>'
            '      </Directory>'
            '    </Directory>'
            '    <Feature Id="ProductFeature" Title="ZeroTierOne" Level="1">'
            '      <ComponentRef Id="MainExe" />'
            '    </Feature>'
            '  </Product>'
            '</Wix>'
          )
          $lines | Set-Content -Path installer\installer.wxs -Encoding UTF8

      - name: Package MSI
        shell: pwsh
        run: |
          candle installer\installer.wxs
          light installer\installer.wixobj -o ZeroTierOne-x64.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTierOne-x64
          path: |
            build/Release/zerotier-one.exe
            ZeroTierOne-x64.msi
