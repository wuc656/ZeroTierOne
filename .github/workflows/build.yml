name: Build ZeroTier MSI (Win7/2008R2 x64)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    env:
      WINVER: 0x0601
      WIN32_WINNT: 0x0601
      CONFIGURATION: Release
      ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Install CMake 3.21
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.21.0

      - name: Configure (CMake → VS2019 solution)
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 16 2019" -A $env:ARCH -T v142 -DWINVER=$env:WINVER -D_WIN32_WINNT=$env:WIN32_WINNT -DCMAKE_POLICY_VERSION_MINIMUM=3.5.0

      - name: Build (cmake --build)
        shell: pwsh
        run: cmake --build build --config $env:CONFIGURATION --parallel

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wix --version=3.11.2 -y

      - name: Generate installer.wxs
        shell: pwsh
        run: |
          $exePath = "build\Release\zerotier-one.exe"
          $lines = @()
          $lines += '<?xml version="1.0" encoding="UTF-8"?>'
          $lines += '<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">'
          $lines += '  <Product Id="*" Name="ZeroTierOne" Language="1033" Version="1.0.0.0" Manufacturer="YourOrg" UpgradeCode="11111111-2222-3333-4444-555555555555">'
          $lines += '    <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />'
          $lines += '    <MediaTemplate />'
          $lines += '    <Directory Id="TARGETDIR" Name="SourceDir">'
          $lines += '      <Directory Id="ProgramFiles64Folder">'
          $lines += '        <Directory Id="INSTALLFOLDER" Name="ZeroTierOne">'
          $lines += '          <Component Id="MainExe" Guid="aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee">'
          $lines += "            <File Id='ZeroTierExe' Source='$exePath' KeyPath='yes' />"
          $lines += '          </Component>'
          $lines += '        </Directory>'
          $lines += '      </Directory>'
          $lines += '    </Directory>'
          $lines += '    <Feature Id="ProductFeature" Title="ZeroTierOne" Level="1">'
          $lines += '      <ComponentRef Id="MainExe" />'
          $lines += '    </Feature>'
          $lines += '  </Product>'
          $lines += '</Wix>'
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $lines | Set-Content -Path installer\installer.wxs -Encoding UTF8

      - name: Package MSI
        shell: pwsh
        run: |
          candle installer\installer.wxs
          light installer\installer.wixobj -o ZeroTierOne-x64.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTierOne-x64
          path: |
            build/Release/zerotier-one.exe
            ZeroTierOne-x64.msi
