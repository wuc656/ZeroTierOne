name: Build ZeroTier MSI (Win7/2008R2 x64, Prometheus enabled, fixed includes)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    env:
      CONFIGURATION: Release
      ARCH: x64
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.21.0

      - name: Install vcpkg (bootstrap)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install nlohmann-json:$env:VCPKG_DEFAULT_TRIPLET
          & "$env:VCPKG_ROOT\vcpkg.exe" install prometheus-cpp:$env:VCPKG_DEFAULT_TRIPLET
          $prefix = "C:\vcpkg\installed\x64-windows"
          if (!(Test-Path "$prefix\include\nlohmann\json.hpp")) { throw "nlohmann/json.hpp missing at $prefix\include\nlohmann" }
          if (!(Test-Path "$prefix\include\prometheus")) { Write-Host "prometheus headers present from vcpkg (standard API)" }

      - name: Persist MSVC INCLUDE/LIB across steps
        shell: pwsh
        run: |
          $prefix = "C:\vcpkg\installed\x64-windows"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$prefix\include;$env:INCLUDE"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$prefix\lib;$env:LIB"

      - name: Configure (CMake → VS2019 solution, Win7 compatible, Prometheus enabled)
        shell: pwsh
        run: |
          $prefix = "C:/vcpkg/installed/x64-windows"
          $simpleapi = "${{ github.workspace }}/ext/prometheus-cpp-lite-1.0/simpleapi"
          if (!(Test-Path $simpleapi)) { throw "Missing ext/prometheus-cpp-lite-1.0/simpleapi at $simpleapi" }

          # 以編譯器旗標強制標準與 include，避免 target 未繼承 CMake 變數的情況
          $extraCxxFlags = @(
            "/std:c++17"           # MSVC 標準
            "/Zc:__cplusplus"      # 正確報告 __cplusplus
            "/permissive-"         # 嚴格 C++ 規範模式
            "/I $simpleapi"        # ZeroTier 自帶 simpleapi 路徑
            "/I $prefix/include"   # vcpkg include 路徑
          ) -join " "

          cmake -S . -B build -G "Visual Studio 16 2019" -A $env:ARCH -T v142 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF `
            -DWINVER=0x0601 `
            -D_WIN32_WINNT=0x0601 `
            -DZT_ENABLE_PROMETHEUS=ON `
            -DCMAKE_PREFIX_PATH=$prefix `
            -DCMAKE_CXX_FLAGS="$extraCxxFlags"

      - name: Verify vcxproj includes and defines
        shell: pwsh
        run: |
          $vcx = "build/zerotiercore.vcxproj"
          if (!(Test-Path $vcx)) { throw "vcxproj not found: $vcx" }

          $projDir = (Resolve-Path "${{ github.workspace }}/ext/prometheus-cpp-lite-1.0/simpleapi").Path
          $vcpkgInc = "C:\\vcpkg\\installed\\x64-windows\\include"

          $vc = Get-Content $vcx -Raw
          $hasInc = ($vc -match [regex]::Escape($projDir)) -and ($vc -match [regex]::Escape($vcpkgInc))
          $hasWin7 = ($vc -match "_WIN32_WINNT=0x0601") -and ($vc -match "WINVER=0x0601")

          if (-not $hasInc) { throw "AdditionalIncludeDirectories missing either $projDir or $vcpkgInc in $vcx" }
          if (-not $hasWin7) { throw "PreprocessorDefinitions missing WINVER/_WIN32_WINNT=0x0601 in $vcx" }
          Write-Host "vcxproj verification passed."

      - name: Build (cmake --build)
        shell: pwsh
        run: cmake --build build --config $env:CONFIGURATION --parallel

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wix --version=3.11.2 -y

      - name: Generate installer.wxs
        shell: pwsh
        run: |
          $exePath = "build\Release\zerotier-one.exe"
          if (!(Test-Path $exePath)) { throw "Executable not found at $exePath" }
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $lines = @(
            '<?xml version="1.0" encoding="UTF-8"?>'
            '<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">'
            '  <Product Id="*" Name="ZeroTierOne" Language="1033" Version="1.0.0.0" Manufacturer="YourOrg" UpgradeCode="11111111-2222-3333-4444-555555555555">'
            '    <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />'
            '    <MediaTemplate />'
            '    <Directory Id="TARGETDIR" Name="SourceDir">'
            '      <Directory Id="ProgramFiles64Folder">'
            '        <Directory Id="INSTALLFOLDER" Name="ZeroTierOne">'
            '          <Component Id="MainExe" Guid="aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee">'
            "            <File Id='ZeroTierExe' Source='$exePath' KeyPath='yes' />"
            '          </Component>'
            '        </Directory>'
            '      </Directory>'
            '    </Directory>'
            '    <Feature Id="ProductFeature" Title="ZeroTierOne" Level="1">'
            '      <ComponentRef Id="MainExe" />'
            '    </Feature>'
            '  </Product>'
            '</Wix>'
          )
          $lines | Set-Content -Path installer\installer.wxs -Encoding UTF8

      - name: Package MSI
        shell: pwsh
        run: |
          candle installer\installer.wxs
          light installer\installer.wixobj -o ZeroTierOne-x64.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTierOne-x64
          path: |
            build/Release/zerotier-one.exe
            ZeroTierOne-x64.msi
