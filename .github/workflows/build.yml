name: Build ZeroTier MSI (Win7/2008R2 x64)

on:
  push:
    branches: [ dev ]   # ZeroTierOne 預設分支是 dev
  pull_request:
    branches: [ dev ]
  workflow_dispatch:     # 支援手動觸發

jobs:
  build:
    runs-on: windows-2019   # 使用 VS2019 (v142 toolset)

    env:
      WINVER: 0x0601
      WIN32_WINNT: 0x0601
      CMAKE_GENERATOR: Visual Studio 16 2019
      MSVC_TOOLSET: v142
      CONFIGURATION: Release
      ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure (CMake → VS2019 solution)
        run: |
          cmake -S . -B build ^
            -G "%CMAKE_GENERATOR%" ^
            -A %ARCH% ^
            -T %MSVC_TOOLSET% ^
            -DWINVER=%WINVER% ^
            -D_WIN32_WINNT=%WIN32_WINNT% ^
            -DCMAKE_C_FLAGS="/DWINVER=%WINVER% /D_WIN32_WINNT=%WIN32_WINNT%" ^
            -DCMAKE_CXX_FLAGS="/DWINVER=%WINVER% /D_WIN32_WINNT=%WIN32_WINNT%"

      - name: Build Solution
        run: msbuild build/ZeroTierOne.sln /p:Configuration=%CONFIGURATION% /m

      - name: Install WiX Toolset
        run: choco install wix --version=3.11.2 -y

      - name: Generate minimal WiX installer.wxs
        run: |
          mkdir installer
          echo ^<?xml version="1.0" encoding="UTF-8"?^> > installer\installer.wxs
          echo ^<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi"^> >> installer\installer.wxs
          echo   ^<Product Id="*" Name="ZeroTierOne" Language="1033" Version="1.0.0.0" Manufacturer="YourOrg" UpgradeCode="PUT-GUID-HERE"^> >> installer\installer.wxs
          echo     ^<Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" /^> >> installer\installer.wxs
          echo     ^<MediaTemplate /^> >> installer\installer.wxs
          echo     ^<Directory Id="TARGETDIR" Name="SourceDir"^> >> installer\installer.wxs
          echo       ^<Directory Id="ProgramFilesFolder"^> >> installer\installer.wxs
          echo         ^<Directory Id="INSTALLFOLDER" Name="ZeroTierOne"^> >> installer\installer.wxs
          echo           ^<Component Id="MainExe" Guid="PUT-GUID-HERE"^> >> installer\installer.wxs
          echo             ^<File Id="ZeroTierExe" Source="build\\Release\\zerotier-one.exe" KeyPath="yes" /^> >> installer\installer.wxs
          echo           ^</Component^> >> installer\installer.wxs
          echo         ^</Directory^> >> installer\installer.wxs
          echo       ^</Directory^> >> installer\installer.wxs
          echo     ^</Directory^> >> installer\installer.wxs
          echo     ^<Feature Id="ProductFeature" Title="ZeroTierOne" Level="1"^> >> installer\installer.wxs
          echo       ^<ComponentRef Id="MainExe" /^> >> installer\installer.wxs
          echo     ^</Feature^> >> installer\installer.wxs
          echo   ^</Product^> >> installer\installer.wxs
          echo ^</Wix^> >> installer\installer.wxs

      - name: Package MSI
        run: |
          candle installer\installer.wxs
          light installer\installer.wixobj -o ZeroTierOne-x64.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTierOne-x64
          path: |
            build/Release/zerotier-one.exe
            ZeroTierOne-x64.msi
